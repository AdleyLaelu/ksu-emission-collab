server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://backend:5003/health;
    }

    location /auth/ {
        proxy_pass http://backend:5003/auth/;
    }

    location /admin/ {
        proxy_pass http://backend:5003/admin/;
    }

    location /predict_emissions {
        proxy_pass http://backend:5003/predict_emissions;
    }

    location /predict_consumption {
        proxy_pass http://backend:5003/predict_consumption;
    }

    location /upload/ {
        proxy_pass http://backend:5003/upload/;
        client_max_body_size 50M;
    }

    location /process/ {
        proxy_pass http://backend:5003/process/;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }

    location /results/ {
        proxy_pass http://backend:5003/results/;
    }

    location /plot/ {
        proxy_pass http://backend:5003/plot/;
    }
}
