version: "3.8"

services:
  backend:
    build: ./backend
    container_name: traffic-backend
    restart: unless-stopped
    volumes:
      - db-data:/app/db
    environment:
      - DB_FILE=/app/db/prediction.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: traffic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
